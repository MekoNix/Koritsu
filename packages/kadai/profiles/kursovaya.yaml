# kursovaya.yaml — профиль вида работы «курсовая».
#
# Профиль — данные, а не код (записка Б.3, решение владельца Л.6). При смене вида
# работы меняются ровно три вещи: набор разделов, набор обязательных стадий и
# требования оформления. Все три лежат здесь, поэтому «а если завтра лабораторная»
# — это новый файл рядом, а не ветка `if` в стадиях. Цена ошибки, если сделать
# наоборот: второй сценарий разведёт код на два почти одинаковых пути, и через
# полгода «почему у реферата не ставится оглавление» будет отвечаться чтением обоих.
#
# В первой версии профиль один — так решено (записка З.3): второй заводится после
# того, как первый прошёл живой прогон, иначе оба будут спроектированы по догадке.

name: курсовая
title: Курсовая работа
# Заготовка DOCX: титульник кафедры, поля, шрифт, стили. Лежит рядом с профилем и
# принадлежит kadai (записка В.2) — «а если другая кафедра» отвечается заменой файла.
# Файла ещё нет: его негде взять, пока нет hokoku.build_template (шов «шаблон»).
base: kursovaya.docx

# Какие стадии нужны этому виду работы. У реферата не будет «решения»: ему не нужны
# ни код, ни схемы, и стадия должна отсутствовать, а не «выполниться вхолостую» —
# иначе полоска хода врёт о работе, которой не было.
stages: [приём, разбор задания, шаблон, решение, тексты, сборка, архив]

# Что работа обязана содержать по существу. Проверяется до дорогих стадий: структура
# курсовой без единого листинга — это неверно понятое условие, а не мелочь оформления.
needs:
  code: true
  diagrams: true

volume:
  sections_min: 6
  sections_max: 18
  # Знаки — не сито этого файла: объём проверяется на готовых значениях лимитами
  # манифеста (`limits.max_chars` ниже), а здесь цифры нужны заданию модели.
  chars_min: 12000
  chars_max: 60000

# Закрытый список видов раздела. Закрытый намеренно (записка В.3 п.3): всё, что вне
# списка, молча стало бы обычным markdown-тегом — заголовок был бы, а нумерации и
# ссылок не было бы, и заметили бы это на кафедре.
#   type      — тип тега hokoku; его назначает профиль, а не модель. Тип, угаданный
#               по метке, — известная беда (`manifest.suggest_type` помечает `guessed`),
#               и цена её в том, что модель напишет про схему прозой, а отчёт соберётся.
#   required  — раздел обязателен: без него структура отвергается.
#   many      — вид может встретиться несколько раз (глав и листингов много, введение одно).
#   numbered  — участвует ли в нумерации разделов.
kinds:
  титульник:   {type: markdown, required: true,  many: false, numbered: false, limits: {max_chars: 800}}
  оглавление:  {type: toc,      required: true,  many: false, numbered: false, limits: {}}
  введение:    {type: markdown, required: true,  many: false, numbered: true,  limits: {max_chars: 6000}}
  постановка:  {type: markdown, required: true,  many: false, numbered: true,  limits: {max_chars: 8000}}
  теория:      {type: markdown, required: false, many: true,  numbered: true,  limits: {max_chars: 12000}}
  метод:       {type: markdown, required: false, many: true,  numbered: true,  limits: {max_chars: 12000}}
  реализация:  {type: markdown, required: true,  many: true,  numbered: true,  limits: {max_chars: 12000}}
  листинг:     {type: code,     required: false, many: true,  numbered: true,  limits: {max_chars: 8000}}
  схема:       {type: diagram,  required: false, many: true,  numbered: true,  limits: {}}
  таблица:     {type: table,    required: false, many: true,  numbered: true,  limits: {max_rows: 40, max_cols: 8}}
  рисунок:     {type: image,    required: false, many: true,  numbered: true,  limits: {}}
  результаты:  {type: markdown, required: true,  many: false, numbered: true,  limits: {max_chars: 10000}}
  заключение:  {type: markdown, required: true,  many: false, numbered: true,  limits: {max_chars: 6000}}

# Виды, которые модель предложит почти наверняка и которых сегодня нет в hokoku
# (записка З.2). Отказ с внятным текстом, а не молчаливое падение в markdown:
# «Приложение А» без нумерации «А.1» и «[3]» без списка источников выглядят готовой
# работой ровно до проверки.
forbidden:
  приложение: >-
    приложений по ГОСТ 7.32 в hokoku нет: нумерации «А.1» не будет, а раздел
    выглядел бы готовым. Просите вынести материал в обычный раздел.
  библиография: >-
    списка источников и ссылок «[3]» в hokoku нет ({cite:…} не поддержан):
    библиография молча стала бы обычным текстом без ссылок.
  широкая_таблица: >-
    таблиц шире восьми колонок hokoku не умеет (альбомная секция не сделана):
    таблица уехала бы за поле страницы.
