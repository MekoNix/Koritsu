# styles.yaml — оформление и геометрия диаграмм uml_generator.
#
# themes.<имя>  — палитра. Выбирается параметром build_xml(..., theme=...).
#   class / interface / struct  — заливка и обводка блоков (struct — также enum/record/union)
#   header_font, member_font    — цвет текста заголовка и строк
#   edge                        — цвет линий связей
#   edge_label                  — подпись у линии (кратность, имя слота)
#   junction                    — точка слияния стрелок наследования
#   object / summary            — блоки диаграммы объектов (obektis); summary — свёрнутая коллекция
#   containment                 — рёбра «элемент коллекции» в диаграмме объектов
#
# roles — имена CSS-переменных для темы `css` (build_xml(..., theme="css")). Тема `css`
#   не задаёт цвета: она пишет `var(--роль, светлый-hex)`, где запасной цвет берётся из
#   темы `light`. Одна и та же схема тогда годится и в интерфейс, и в отчёт: в SVG роль
#   выносится наружу дословно (страница красит её своей темой), в PNG CSS-контекста нет
#   и рисуется запасной цвет — отчёт получает светлую схему без всякой подстановки.
#   Запасной цвет обязателен: `var(--роль)` без него draw.io рисует чёрным.
#   Имена ролей общие по смыслу, а не «под uml» — те же нужны fragmos, а --node-fill,
#   --node-line, --node-text, --edge, --edge-label уже есть в контракте токенов интерфейса.
#
# layout — размеры в px. Любой ключ можно перегрузить через cfg_overrides.

themes:
  dark:
    class:       {fill: "#1e293b", stroke: "#475569"}
    interface:   {fill: "#0f1729", stroke: "#6366f1"}
    struct:      {fill: "#172033", stroke: "#0ea5e9"}
    header_font: "#f1f5f9"
    member_font: "#94a3b8"
    edge:        "#64748b"
    edge_label:  "#94a3b8"
    junction:    "#64748b"
    object:      {fill: "#1f2a44", stroke: "#7c84a8"}
    summary:     {fill: "#2a1f44", stroke: "#a87cc4"}
    slot_font:   "#cbd5e1"
    containment: "#8b7fd0"
  light:
    class:       {fill: "#ffffff", stroke: "#334155"}
    interface:   {fill: "#eef2ff", stroke: "#4f46e5"}
    struct:      {fill: "#f0f9ff", stroke: "#0284c7"}
    header_font: "#0f172a"
    member_font: "#334155"
    edge:        "#334155"
    edge_label:  "#334155"
    junction:    "#334155"
    object:      {fill: "#f8fafc", stroke: "#475569"}
    summary:     {fill: "#f5f3ff", stroke: "#7c3aed"}
    slot_font:   "#1e293b"
    containment: "#6d28d9"

roles:
  class:       {fill: node-fill,        stroke: node-line}          # обычный узел
  object:      {fill: node-fill,        stroke: node-line}
  interface:   {fill: node-accent-fill, stroke: node-accent-line}   # узел, выделенный смыслом
  struct:      {fill: node-alt-fill,    stroke: node-alt-line}      # узел другого рода
  summary:     {fill: node-alt-fill,    stroke: node-alt-line}
  header_font: node-text                                            # основной текст узла
  member_font: node-text-muted                                      # второстепенный текст
  slot_font:   node-text-muted
  edge:        edge                                                 # линия связи
  edge_label:  edge-label                                           # подпись у линии
  containment: edge-alt                                             # линия другого рода
  junction:    edge-dot                                             # точка на линии

layout:
  header_font:   12     # px, заголовок блока (bold)
  member_font:   11     # px, строки членов / слотов
  size_grid:     10     # округление ширины вверх до сетки
  pad_x:         28     # горизонтальный padding внутри блока
  min_w:         160    # минимальная ширина блока
  h_gap:         60     # зазор между блоками в ряду
  v_gap:         110    # зазор между рядами (в нём лежат коридоры и junction'ы)
  header_h:      32
  row_h:         22
  sep_h:         8
  min_h:         60
  start_x:       60
  start_y:       60
  max_row_w:     1500   # ряд шире — переносим на следующий
  route_margin:  18     # зазор вокруг блоков при обходе
  junction_r:    4      # радиус точки слияния
  junction_step: 14     # сдвиг по y для второго junction в том же коридоре
  collapse_min:  4      # objektis: сворачивать коллекцию из N одинаковых элементов в один «[N]»
