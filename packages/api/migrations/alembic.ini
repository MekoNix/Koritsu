; Настройки Alembic для командной строки. Код (`api.db.migrate`) этот файл
; не читает: он собирает конфигурацию сам и кладёт в неё `Settings`.
;
; Отсюда главное: `sqlalchemy.url` здесь пуст намеренно. URL берётся из
; `KORITSU_DB_URL` или из тома `KORITSU_DATA_DIR` — см. `env.py`. Строка
; подключения в файле под контролем версий означала бы, что кто-то однажды
; применит миграцию к чужой базе, потому что «в ini так написано».
;
; Как этим пользуются агенты B/C/D (одна миграция на агента):
;
;   PYTHONPATH=packages \
;   KORITSU_DATA_DIR=/tmp/koritsu-mig \
;   KORITSU_SECRET=$(python -c "import secrets;print(secrets.token_hex(32))") \
;   alembic -c packages/api/migrations/alembic.ini \
;           revision --autogenerate -m "accounts"

[alembic]
script_location = %(here)s
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
