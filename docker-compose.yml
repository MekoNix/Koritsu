# Koritsu, боевой выкат: основной образ на три контейнера, образ исполнителя трасс
# и два чужих образа.
#
#   migrate     один прогон миграций до всего остального, потом выходит
#   api         HTTP, лёгкий; в покое около 100 МБ
#   worker      очередь: прогоны модели, LibreOffice, разбор файлов; 300–500 МБ
#   asm-runner  исполнитель трасс «Ассемблера» MinGW x64: программа студента под
#               Wine; без сети, без прав и без тома данных
#   caddy       TLS, статика сайта, единственный, кто смотрит наружу
#   anubis      проверка работой перед сайтом; только здесь, dev его не поднимает
#
# Порт наружу торчит **только** у Caddy. `api` и `worker` разговаривают по
# внутренней сети compose и общему тому — так же, как будут разговаривать с
# вторым сервером, когда он появится: воркер общается с API только через
# очередь и том.
#
# Запуск:  docker compose up -d --build
# Остановка: docker compose down          (том остаётся, `down -v` его сносит)
# Секреты: файл `.env` рядом с этим, на хосте, вне репозитория. Образец —
# `.env.example`.

# Журналы контейнеров — у всех одинаково: `json-file` с ротацией, три файла по
# 10 МБ. Без потолка драйвер Docker пишет журнал без конца, и зациклившийся
# сервис (или программа, печатающая в stderr) съедает диск машины — а на нём же
# живут том данных и образы. 30 МБ на сервис хватает, чтобы разобрать сбой.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── миграции ────────────────────────────────────────────────────────────
  # Отдельным контейнером и до всех остальных. Довод — в `api/__main__.py`:
  # `create_app` мигрирует и сам, но три процесса, поднявшиеся разом и
  # мигрирующие каждый сам, — это три `ALTER TABLE` на одной SQLite и
  # «database is locked» у двоих из троих.
  migrate:
    build: .
    image: koritsu:local
    command: ["migrate"]
    env_file: [.env]
    volumes:
      - koritsu-data:/data
    restart: "no"
    logging: *logging

  # ── служба ──────────────────────────────────────────────────────────────
  api:
    image: koritsu:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["serve", "--host", "0.0.0.0"]
    env_file: [.env]
    volumes:
      - koritsu-data:/data
      # TASM и TLINK для модуля «Ассемблер»: проприетарные, в образ не входят и
      # приезжают каталогом с машины, только для чтения. Служба смотрит, есть ли
      # они (`/api/asm/status`); прогоны идут в воркере. Каталога нет — Docker
      # заведёт пустой, и модуль покажется недоступным.
      - ${KORITSU_ASM_TOOLS_HOST:-./asm-tools}:/opt/asm-tools:ro
      # Очередь исполнителя трасс MinGW x64 — только для чтения: служба смотрит
      # в ней сердцебиение исполнителя, чтобы говорить, готов ли режим.
      - asm-queue:/queue:ro
    # Порт не публикуется: снаружи в него ходит только Caddy, по внутренней
    # сети. `ports:` здесь означал бы сайт, доступный мимо TLS и мимо Anubis.
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    logging: *logging

  # ── воркер ──────────────────────────────────────────────────────────────
  # Потолки памяти и CPU стоят **здесь**, а не у службы, и это половина довода
  # за два контейнера: зависший LibreOffice не роняет сайт. Числа — с запасом
  # над горячим LibreOffice (300–500 МБ) и над `KORITSU_JOB_MEMORY_MB` одного
  # задания: воркер держит два слота, и оба могут работать разом.
  worker:
    image: koritsu:local
    # `init` — PID 1 контейнера жнёт осиротевшие процессы. Воркер запускает
    # подпроцессы с деревьями (Xvfb, Electron у drawio, LibreOffice), и убитое по
    # таймауту дерево без этого оставляет зомби до перезапуска контейнера.
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["worker"]
    env_file: [.env]
    volumes:
      - koritsu-data:/data
      # Тот же каталог TASM/TLINK, что у `api`: сборку и трассу исполняет воркер.
      - ${KORITSU_ASM_TOOLS_HOST:-./asm-tools}:/opt/asm-tools:ro
      # Очередь исполнителя трасс MinGW x64: воркер собирает программу сам, а
      # исполнять её отдаёт `asm-runner` через этот том (`KORITSU_ASM_MINGW_QUEUE`).
      - asm-queue:/queue
    mem_limit: 3g
    cpus: 1.5
    # Своя проверка здоровья, потому что унаследованная из образа не годится:
    # там она стучится по HTTP на `/health`, а воркер HTTP не слушает вовсе —
    # и контейнер, делающий свою работу, вечно значился `unhealthy`. Ложная
    # тревога хуже её отсутствия: оператор перестаёт верить `docker compose ps`
    # и пропускает настоящую.
    #
    # Проверяется то, без чего воркер бесполезен, даже будучи живым: база
    # отвечает и том пишется. Сердцебиение для этого не годится — его пишет
    # только взявший задание (`jobs/models.Job.heartbeat_at`), и у простаивающего
    # воркера свежего сердцебиения нет по определению.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sqlite3,sys; d=os.environ.get('KORITSU_DATA_DIR','/data'); sqlite3.connect(f'file:{d}/koritsu.db?mode=ro', uri=True).execute('select 1').fetchone(); sys.exit(0 if os.access(d, os.W_OK) else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # SIGTERM для воркера — «доделай начатое и не бери новых» (`jobs/worker.py`).
    # Времени на это даёт `stop_grace_period`; меньше `KORITSU_JOB_TIMEOUT_S`
    # оно быть может (задание вернётся через сердцебиение), но не должно быть
    # меньше обычной сборки PDF — иначе каждый выкат теряет по отчёту.
    stop_grace_period: 120s
    restart: unless-stopped
    logging: *logging

  # ── исполнитель трасс MinGW x64 ─────────────────────────────────────────
  # Код студента здесь исполняется по-настоящему: `prog.exe` под Wine на
  # процессоре машины. Wine не мешает программе звать системные вызовы Linux и
  # открывать файлы машины по пути `\\?\unix\`, поэтому граница — сам контейнер,
  # и каждая строка ниже — её часть:
  #
  #   network_mode: none   ни одного интерфейса, кроме петли
  #   без env_file         секреты службы из `.env` сюда не попадают
  #   только asm-queue     ни тома данных, ни каталога TASM; в очереди — только
  #                        файлы заданий
  #   user 10002:10001     свой UID, общая с воркером группа ради очереди
  #   cap_drop ALL,        ни одной capability и без повышения прав через setuid;
  #   no-new-privileges    трассировщику они не нужны: он трассирует своего
  #                        потомка (`PTRACE_TRACEME`), seccomp Docker это пускает
  #   read_only + tmpfs    писать можно только во временный каталог прогона;
  #                        `exec` на tmpfs нужен — Wine отображает `prog.exe` и
  #                        префикс прогона с правом исполнения
  #   init                 wineserver отцепляется от запустившего его процесса, и
  #                        без жнеца на PID 1 копятся зомби
  #   mem_limit, cpus,     потолки на всё сразу: прогонов одновременно
  #   pids_limit           `KORITSU_ASM_RUNNER_SLOTS`, у каждого wineserver и
  #                        процесс программы с потоками; tmpfs считается в память
  #
  # Нужен хост с `kernel.yama.ptrace_scope` не выше 1 (умолчание Debian и
  # Ubuntu): при 2 и 3 трассировать потомка без прав нельзя.
  asm-runner:
    build:
      context: .
      dockerfile: Dockerfile.asm-runner
    image: koritsu-asm-runner:local
    command: ["serve"]
    user: "10002:10001"
    network_mode: none
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 256
    environment:
      KORITSU_ASM_MINGW_QUEUE: /queue
      KORITSU_ASM_RUNNER_SLOTS: "${KORITSU_ASM_RUNNER_SLOTS:-2}"
      KORITSU_ASM_RUNNER_TIMEOUT_MAX_S: "${KORITSU_ASM_RUNNER_TIMEOUT_MAX_S:-300}"
      KORITSU_ASM_RUNNER_JOB_TTL_S: "${KORITSU_ASM_RUNNER_JOB_TTL_S:-900}"
    volumes:
      - asm-queue:/queue
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  # ── прокси и сайт ───────────────────────────────────────────────────────
  # Один контейнер на двоих, и это не экономия: образ Docker с сайтом — это
  # многоступенчатая сборка, из которой в бой уезжают только файлы.
  # `web/Dockerfile` собирает сайт Node'ом в первой ступени и кладёт готовый
  # `dist` в `/srv/web` последней, где никакого Node уже нет, — а последняя
  # ступень там и есть `caddy:2-alpine`. Отдельного контейнера у сайта
  # по-прежнему нет, но статика приезжает выкатом, а не лежит на хосте: каждый
  # `up --build` отдаёт ровно ту сборку, что сделана из этого кода.
  #
  # `Caddyfile` при этом остаётся файлом на хосте и монтируется: правка домена
  # или белого списка адресов не должна требовать пересборки сайта.
  caddy:
    build:
      context: ./web
      args:
        # Префикс пути, под которым живёт сайт. Он нужен **на сборке**, а не
        # на запуске: Vite вписывает его в `index.html` и во все
        # ссылки на `assets/`, и поменять его потом можно только пересборкой.
        # Значение обязано совпадать с `KORITSU_BASE_PATH` ниже плюс косая на
        # конце — иначе страница загрузится, а скрипты к ней не приедут.
        # Подробности и пример — в `.env.example`.
        VITE_BASE_PATH: "${VITE_BASE_PATH:-/}"
    image: koritsu-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Адрес сайта целиком, вместе со схемой: `http://203.0.113.7` на время
      # теста без домена (тогда TLS не выпускается вовсе) или `koritsu.example`,
      # когда домен появится. Умолчание — заглушка `.example`:
      # зона зарезервированная, то есть заведомо ничья, и забытая в бою она не
      # уведёт запросы к чужому серверу. **Ни IP, ни домен в репозиторий не
      # попадают** — они живут строкой в `.env` на машине.
      KORITSU_DOMAIN: "${KORITSU_DOMAIN:-http://koritsu.example}"
      # Префикс пути: случайная строка вроде `/k7f3x9`, чтобы сайт не нашли
      # перебором. Пусто — сайт в корне. Здесь он нужен Caddy, а тот же префикс
      # на сборке сайта — выше, в `args`.
      KORITSU_BASE_PATH: "${KORITSU_BASE_PATH:-}"
      # Белый список адресов админки, CIDR через пробел. Пусто или не задано —
      # петля, то есть снаружи админка закрыта всем: умолчание тут
      # обязано быть глухим, а не открытым. Подробности — в `.env.example`.
      KORITSU_ADMIN_ALLOW: "${KORITSU_ADMIN_ALLOW:-127.0.0.1/32 ::1}"
      # Имя домена админки: она вынесена на домен третьего уровня, у неё свой
      # блок в `Caddyfile` — тот же сайт и тот же `/api`, но целиком под белым
      # списком выше. Пусто или не задано — заглушка `.example`, то есть имя,
      # которого нет в DNS: снаружи админка тогда недоступна вовсе, а на
      # основном имени `/admin` и `/api/admin/*` отвечают 404. Ту же строку
      # читает служба (в `.env`, у `api` и `worker`), и по ней она отказывает
      # админским маршрутам на чужом `Host`.
      KORITSU_ADMIN_DOMAIN: "${KORITSU_ADMIN_DOMAIN:-http://admin.koritsu.example}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging: *logging

  # ── проверка работой ────────────────────────────────────────────────────
  # Anubis (TecharoHQ) — самостоятельный прокси-фильтр: выдаёт браузеру задачу
  # на хеш, боту в массе это дорого, человеку незаметно. Нашего кода не
  # требует и стоит между Caddy и `api`.
  #
  # ВНИМАНИЕ: имена переменных ниже по документации не выверены. `BIND`,
  # `TARGET` и `DIFFICULTY` у Anubis есть точно; всё остальное (политика
  # файлом, ключ подписи cookie, домен cookie, метрики) — **проверить по docs**
  # перед первым боевым выкатом:
  # https://anubis.techaro.lol/docs/admin/installation
  # Проверять там же и умолчание сложности: 4 взято навскидку.
  anubis:
    image: ghcr.io/techarohq/anubis:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      BIND: ":8923"
      # Куда пропускать прошедших проверку: статику отдаёт Caddy, поэтому
      # целью Anubis служит он же, своим внутренним портом (см. `Caddyfile`).
      TARGET: "http://caddy:8080"
      DIFFICULTY: "4"
      SERVE_ROBOTS_TXT: "true"        # проверить по docs
    expose: ["8923"]
    restart: unless-stopped
    logging: *logging

volumes:
  # Единственное состояние службы: сам контейнер без состояния, всё живое —
  # только в `/data`. Резервная копия — restic по cron на хосте, отсюда же.
  koritsu-data:
  # Очередь исполнителя трасс: задания живут в ней секунды, результат забирает
  # воркер, брошенное удаляет исполнитель по сроку. Резервной копии не нужно.
  asm-queue:
  # Сертификаты Let's Encrypt: без своего тома Caddy выписывает их заново на
  # каждый `up`, а у центра сертификации на это есть недельный лимит.
  caddy-data:
  caddy-config:
