# Dev поверх боевого compose: окружения prod и dev уживаются на одной машине,
# у dev свой том, свой порт и свой `.env`.
#
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Четыре отличия от боевого:
#
# 1. **Anubis не поднимается** — он нужен только в бою. Проверка работой
#    на машине разработчика мешает ровно тому, ради чего dev и заведён, — быстро
#    открыть страницу и посмотреть. Здесь она отключена `replicas: 0`, а не
#    удалением сервиса: убрать сервис целиком оверлей compose не умеет — только
#    дописать поле, переопределить его или обнулить (`!reset`).
# 2. **Порт службы наружу.** Caddy с настоящим TLS на dev не нужен: домена нет,
#    сертификат выписывать не на что. Сайт при разработке поднимает Vite своим
#    сервером, а он ходит в API по этому порту.
# 3. **`KORITSU_ENV=dev`.** Отсюда `trust_proxy=false` (порт открыт напрямую,
#    и верить `X-Forwarded-For` нельзя — им подделывается адрес в лимите
#    регистраций) и всё прочее, что служба делает иначе не в бою.
# 4. **Сайт не собирается образом.** В бою статику приносит `web/Dockerfile`
#    (ступень Node → файлы в образе Caddy); здесь `build` обнулён, а `/srv/web`
#    — это каталог `web/dist` с диска. `pnpm build` вместо пересборки образа.
#
# Том свой (`koritsu-data-dev`), и это единственное, что стоит проверять глазами
# перед запуском: dev, случайно подключённый к боевому тому, пишет в работы
# живых людей.

services:

  migrate:
    environment:
      KORITSU_ENV: dev
    volumes:
      - koritsu-data-dev:/data

  api:
    environment:
      KORITSU_ENV: dev
    # Наружу и только на петлю хоста: dev-служба без TLS, открытая в интернет,
    # — это боевая база через месяц.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - koritsu-data-dev:/data

  worker:
    environment:
      KORITSU_ENV: dev
    volumes:
      - koritsu-data-dev:/data
    # Пониже: на машине разработчика рядом живут редактор и браузер.
    mem_limit: 2g
    cpus: 1.0

  # Caddy на dev остаётся: он же отдаёт собранный `web/dist`, когда сайт
  # смотрят не через Vite. TLS ему при этом выписывать не на что — домен
  # `koritsu.example` ничей, и Let's Encrypt на него сертификата не даст;
  # поэтому здесь он слушает открытый порт и только его.
  caddy:
    # Сайт на dev **не собирается образом**: `build: !reset null` возвращает
    # обычный `caddy:2-alpine`, а статику даёт каталог с диска (ниже). Иначе
    # каждая правка компонента означала бы `pnpm install` и `vite build` внутри
    # Docker — минуты вместо секунд, и ради того же самого `web/dist`, который
    # уже лежит рядом.
    build: !reset null
    image: caddy:2-alpine
    # Порт 8080 контейнера, а не 80: снаружи слушает блок `koritsu.example {`,
    # и запрос на `http://127.0.0.1:8080` с таким `Host` в него не попадёт
    # вовсе. Внутренний блок `:8080` из `Caddyfile` отвечает на любое имя и
    # отдаёт и сайт, и `/api` — одним origin, иначе не работала бы cookie
    # сессии.
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      # Админка на dev открыта: порт и так поднят только на петлю хоста, а в
      # `remote_ip` Caddy при этом видит не `127.0.0.1`, а адрес шлюза сети
      # Docker — петля в списке не помогла бы никому, кроме путаницы.
      #
      # Своего имени у админки здесь нет и не нужно: наружу опубликован
      # внутренний блок `:8080`, который отвечает на любое имя и отдаёт весь
      # сайт разом, — а блок имени админки слушает `:80` и наружу не выведен.
      # Служба на dev `KORITSU_ADMIN_DOMAIN` тоже не получает (её берут из
      # `.env`), то есть пускает по флагу `is_admin`, как и раньше.
      KORITSU_ADMIN_ALLOW: "0.0.0.0/0 ::/0"
    volumes:
      # `web/dist` с диска: `pnpm build` — и обновление видно перезагрузкой
      # страницы. Каталога может ещё не быть — тогда Caddy отдаст 404 на всё,
      # кроме `/api/`, и это честнее пустой страницы.
      - ./web/dist:/srv/web:ro

  # Anubis выключен: см. пункт 1 выше.
  anubis:
    deploy:
      replicas: 0

volumes:
  koritsu-data-dev:
