# Dev поверх боевого compose (§7: «окружения prod и dev; dev на той же машине,
# другой том и порт, свой `.env`»).
#
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Три отличия от боевого, и каждое — решение владельца:
#
# 1. **Anubis не поднимается** (§11: «Anubis только в prod»). Проверка работой
#    на машине разработчика мешает ровно тому, ради чего dev и заведён, — быстро
#    открыть страницу и посмотреть. Здесь она отключена `replicas: 0`, а не
#    удалением сервиса: убрать его совсем нельзя, оверлей compose умеет
#    дописывать и переопределять, но не вычёркивать.
# 2. **Порт службы наружу.** Caddy с настоящим TLS на dev не нужен: домена нет,
#    сертификат выписывать не на что. Сайт при разработке поднимает Vite своим
#    сервером, а он ходит в API по этому порту.
# 3. **`KORITSU_ENV=dev`.** Отсюда `trust_proxy=false` (порт открыт напрямую,
#    и верить `X-Forwarded-For` нельзя — им подделывается адрес в лимите
#    регистраций) и всё прочее, что служба делает иначе не в бою.
#
# Том свой (`koritsu-data-dev`), и это единственное, что стоит проверять глазами
# перед запуском: dev, случайно подключённый к боевому тому, пишет в работы
# живых людей.

services:

  migrate:
    environment:
      KORITSU_ENV: dev
    volumes:
      - koritsu-data-dev:/data

  api:
    environment:
      KORITSU_ENV: dev
    # Наружу и только на петлю хоста: dev-служба без TLS, открытая в интернет,
    # — это боевая база через месяц.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - koritsu-data-dev:/data

  worker:
    environment:
      KORITSU_ENV: dev
    volumes:
      - koritsu-data-dev:/data
    # Пониже: на машине разработчика рядом живут редактор и браузер.
    mem_limit: 2g
    cpus: 1.0

  # Caddy на dev остаётся: он же отдаёт собранный `web/dist`, когда сайт
  # смотрят не через Vite. TLS ему при этом выписывать не на что — домен
  # `koritsu.example` ничей, и Let's Encrypt на него сертификата не даст;
  # поэтому здесь он слушает открытый порт и только его.
  caddy:
    ports: !override
      - "127.0.0.1:8080:80"

  # Anubis выключен: см. пункт 1 выше.
  anubis:
    deploy:
      replicas: 0

volumes:
  koritsu-data-dev:
