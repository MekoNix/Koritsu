# Образец формы, в которой строение работы лежит в проекте, — и он живёт в
# тестах, а не в пакете (решение владельца 2026-09-04).
#
# Раньше рядом с кодом лежал файл-профиль вида работы, и он же был умолчанием.
# Теперь умолчания нет вовсе: строение сочиняет модель по условию, а `kadai`
# только просеивает её ответ. Файл остался ровно затем, чтобы форма записи
# проверялась на чём-то, кроме того, что тест сам же и построил: `parse` обязан
# читать её так же, как `as_dict` пишет, — иначе работа, посчитанная одним
# процессом, не откроется в другом.
#
# Содержимое нарочно не учебное: работой бывает что угодно, и код обязан этого
# не замечать.

name: учёт продажи носков
stages: [приём, разбор задания, шаблон, решение, тексты, сборка, архив]

# Чего работа требует по существу. Это утверждение модели о работе, а не наше о
# виде работы: от него зависит, нужна ли работе стадия «решение» вовсе.
needs:
  code: true
  tables: true
  diagrams: false

# Виды разделов: имя придумала модель по условию, тип взят из перечня движка
# отчётов, обязательность объявила она же.
kinds:
  остатки:   {type: table,    required: true}
  выгрузка:  {type: code,     required: false}
  выводы:    {type: markdown, required: true}

# Чего в движке отчётов нет. Утверждение про движок, а не про вид работы:
# появится нумерация приложений — строка уйдёт отсюда сама собой.
forbidden:
  приложение: >-
    приложений с нумерацией «А.1» в движке отчётов нет: раздел выглядел бы
    готовым, а нумерации не было бы.
