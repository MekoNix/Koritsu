[project]
name = "koritsu"
version = "2.0.0a0"           # pre2.0: собираем проект заново
description = "Koritsu — генерация схем и документации из кода: fragmos (блок-схемы), uml_generator (UML классов)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "drawpyo>=0.2.5",
    "PyYAML>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
]

[project.optional-dependencies]
dev = [
    "Pillow>=10",       # labs/fragmos: пиксельный diff
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
"fragmos.builder.modes" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
